<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
<meta name="theme-color" content="#0B0F2A" />
<meta name="robots" content="noindex, nofollow" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Little Artist" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>Little Artist</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Shakedown brand guide: flat colour, square corners, 2px strokes, near-black outlines, pixel font, no motion on press */
  :root {
    --void: #05070F; --navy: #0B0F2A; --band: #1B2352; --white: #DFE8FF; --tag: #8FA6CC; --dim: #5F7099;
    --cyan: #4AD4FF; --warn: #FF4D6A; --ok: #5CFF9D; --gold: #FFD23D;
    --fill: rgba(74,212,255,.12); --fill-on: rgba(74,212,255,.28); --stroke: rgba(74,212,255,.55);
  }
  html, body {
    width: 100%; height: 100%; background: var(--navy); overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: Consolas, Menlo, monospace;
  }
  /* dead strip at the bottom so touches don't start in Android's gesture-nav swipe zone */
  :root { --gesture-gutter: 36px; --u: min(12vh, 10vw); --g: calc(var(--u) * .12); --cs: calc((100vh - var(--u) * 2.2) / 7); }
  #app {
    position: fixed; inset: 0; display: grid;
    grid-template-columns: calc(var(--u) * 1.35) 1fr calc(var(--u) * 1.35);
    grid-template-rows: calc(var(--u) * .85) 1fr;
    gap: var(--g);
    padding: max(var(--g), env(safe-area-inset-top)) max(var(--g), env(safe-area-inset-right)) max(var(--gesture-gutter), env(safe-area-inset-bottom)) max(var(--g), env(safe-area-inset-left));
  }
  #top { grid-column: 1 / 4; display: flex; align-items: center; gap: var(--g); }
  #top .sp { flex: 1; }
  .panel { background: var(--band); box-shadow: 0 0 0 2px var(--void); display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: calc(var(--u) * .1); gap: calc(var(--u) * .1); min-height: 0; }
  button { font: inherit; border: none; cursor: pointer; touch-action: manipulation; }
  .btn { background: var(--fill); color: var(--white); display: flex; align-items: center; justify-content: center; border: 2px solid var(--stroke); }
  .btn:active { background: var(--fill-on); }
  .pi { flex: none; display: block; image-rendering: pixelated; }
  /* labels are drawn in the pixel font; the real text stays in the DOM for screen readers */
  .btn span, #parentCard button {
    color: transparent; text-indent: -9999px; overflow: hidden; white-space: nowrap; image-rendering: pixelated;
    background: var(--pt, none) center / var(--ptw, 0) var(--pth, 0) no-repeat;
  }
  .btn span { display: block; font-size: calc(var(--u) * .16); width: var(--ptw, auto); height: var(--pth, auto); }
  .tool { flex-direction: column; gap: 2px; }
  .big { gap: calc(var(--u) * .1); }
  .big { width: calc(var(--u) * 1.6); height: calc(var(--u) * .85); }
  .tool { width: calc(var(--u) * 1.15); height: calc(var(--u) * .95); }
  .size { width: calc(var(--u) * 1.15); height: calc(var(--u) * .62); }
  .btn.sel { border-color: var(--cyan); background: var(--fill-on); box-shadow: inset 0 0 0 2px var(--cyan); }
  .size i { display: block; background: var(--white); }
  .color { width: min(var(--cs), calc(var(--u) * 1.1)); height: min(var(--cs), calc(var(--u) * 1.1)); border: 2px solid var(--dim); flex: none; }
  .color.sel { box-shadow: 0 0 0 2px var(--band), 0 0 0 4px var(--cyan); }
  #cv { grid-column: 2; grid-row: 2; width: 100%; height: 100%; background: #fff; box-shadow: 0 0 0 2px var(--void); display: block; touch-action: none; min-height: 0; min-width: 0; }
  #parent { position: relative; width: calc(var(--u) * .6); height: calc(var(--u) * .6); background: var(--band); box-shadow: 0 0 0 2px var(--void); color: var(--dim); display: flex; align-items: center; justify-content: center; }
  #parent::after { content: ""; position: absolute; inset: 0; border: 5px solid var(--cyan); transform: scale(0); opacity: 0; transition: none; }
  #parent.hold::after { opacity: 1; transform: scale(1); transition: transform 1.2s linear; }
  .overlay { position: fixed; inset: 0; background: rgba(5,7,15,.75); display: none; align-items: center; justify-content: center; z-index: 5; }
  .overlay.show { display: flex; }
  .card { background: var(--navy); border: 2px solid var(--stroke); box-shadow: 0 0 0 2px var(--void); padding: calc(var(--u) * .4); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * .3); }
  .card .row { display: flex; gap: calc(var(--u) * .4); }
  .yn { width: calc(var(--u) * 1.5); height: calc(var(--u) * 1.5); border: 2px solid; display: flex; align-items: center; justify-content: center; }
  #no { background: rgba(255,77,106,.12); border-color: rgba(255,77,106,.55); }
  #yes { background: rgba(92,255,157,.12); border-color: rgba(92,255,157,.55); }
  #no:active { background: rgba(255,77,106,.28); }
  #yes:active { background: rgba(92,255,157,.28); }
  #parentCard { align-items: stretch; min-width: 380px; }
  #parentCard button { font-size: 21px; height: max(46px, calc(var(--u) * .5)); background-color: var(--fill); border: 2px solid var(--stroke); }
  #parentCard button:active { background-color: var(--fill-on); }
  #parentCard .hint { font: 14px/1.4 system-ui, sans-serif; color: var(--tag); }
  #install { display: none; }
  #installTop { display: none; width: auto; padding: 0 calc(var(--u) * .3); background: var(--fill-on); border-color: var(--cyan); }
  #installTop span { font-size: calc(var(--u) * .24); }
  #installTop.show { display: flex; }
  #trace { display: none; grid-column: 2; grid-row: 2; flex-direction: column; gap: var(--g); min-height: 0; min-width: 0; }
  .tracing #cv { display: none; }
  .tracing #trace { display: flex; }
  .tracing #eraser { visibility: hidden; }
  #tmain { flex: 1; display: flex; gap: var(--g); min-height: 0; }
  #tmodel, #twrap { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; box-shadow: 0 0 0 2px var(--void); }
  #tmodel { background: var(--band); }
  #twrap { background: #fff; }
  #trace.big #tmodel { display: none; }
  #tmodel canvas, #twrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ti { touch-action: none; }
  #tcheer { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: calc(var(--u) * 1.3); color: var(--gold); pointer-events: none; text-shadow: 0 0 0 #fff; }
  #tcheer.show { display: flex; animation: pop .5s ease-out; }
  @keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #tbar { display: flex; align-items: center; justify-content: space-between; gap: var(--g); height: calc(var(--u) * .85); }
  #tbar .grp { display: flex; gap: var(--g); }
  .tb { width: calc(var(--u) * 1.1); height: calc(var(--u) * .85); flex-direction: column; gap: 2px; }
  .tb.tab span { font-size: calc(var(--u) * .3); }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="btn big" id="eraser" aria-label="Eraser"><canvas class="pi" data-ico="eraser" data-k=".4"></canvas><span>Eraser</span></button>
    <button class="btn big" id="undo" aria-label="Undo"><canvas class="pi" data-ico="undo" data-k=".4"></canvas><span>Undo</span></button>
    <button class="btn big" id="traceBtn" aria-label="Trace letters and numbers"><canvas class="pi" data-ico="A" data-k=".35"></canvas><span>Trace</span></button>
    <div class="sp"></div>
    <button class="btn big" id="installTop" aria-label="Install app"><span>Install app</span></button>
    <button id="parent" aria-label="Grown-ups: hold to open"><canvas class="pi" data-ico="lock" data-k=".36" data-col="dim"></canvas></button>
    <div class="sp"></div>
    <button class="btn big" id="clear" aria-label="Clear everything"><canvas class="pi" data-ico="trash" data-k=".4" data-col="warn"></canvas><span>Clear</span></button>
  </div>

  <div class="panel" id="colors"></div>
  <canvas id="cv"></canvas>
  <div id="trace">
    <div id="tmain">
      <div id="tmodel"><canvas id="tmc"></canvas></div>
      <div id="twrap"><canvas id="tg"></canvas><canvas id="ti"></canvas><div id="tcheer">&#9733;&#9733;&#9733;</div></div>
    </div>
    <div id="tbar">
      <div class="grp">
        <button class="btn tb" id="tPrev" aria-label="Previous"><canvas class="pi" data-ico="prev" data-k=".3"></canvas></button>
        <button class="btn tb tab" data-set="ABC" aria-label="Capital letters"><span>ABC</span></button>
        <button class="btn tb tab" data-set="123" aria-label="Numbers"><span>123</span></button>
        <button class="btn tb tab" data-set="abc" aria-label="Small letters"><span>Small</span></button>
      </div>
      <div class="grp">
        <button class="btn tb" id="tSay" aria-label="Say it again"><canvas class="pi" data-ico="say"></canvas></button>
        <button class="btn tb" id="tRedo" aria-label="Try again"><canvas class="pi" data-ico="redo"></canvas></button>
        <button class="btn tb" id="tLay" aria-label="Switch layout"><canvas class="pi" data-ico="layout"></canvas></button>
      </div>
      <div class="grp">
        <button class="btn tb" id="tNext" aria-label="Next"><canvas class="pi" data-ico="next" data-k=".3"></canvas></button>
      </div>
    </div>
  </div>
  <div class="panel" id="tools">
    <button class="btn tool sel" data-tool="pencil" aria-label="Pencil"><canvas class="pi" data-ico="pencil"></canvas><span>Pencil</span></button>
    <button class="btn tool" data-tool="marker" aria-label="Marker"><canvas class="pi" data-ico="marker"></canvas><span>Marker</span></button>
    <button class="btn tool" data-tool="sparkle" aria-label="Sparkle brush"><canvas class="pi" data-ico="sparkle"></canvas><span>Sparkle</span></button>
    <div id="sizes" style="display:contents">
      <button class="btn size" data-size="0" aria-label="Thin"><i style="width:12px;height:12px"></i></button>
      <button class="btn size sel" data-size="1" aria-label="Medium"><i style="width:22px;height:22px"></i></button>
      <button class="btn size" data-size="2" aria-label="Thick"><i style="width:34px;height:34px"></i></button>
    </div>
  </div>
</div>

<div class="overlay" id="confirm">
  <div class="card">
    <canvas class="pi" data-ico="trash" data-k=".9" data-col="warn"></canvas>
    <div class="row">
      <button class="yn" id="no" aria-label="No, keep drawing"><canvas class="pi" data-ico="x" data-k=".5" data-col="warn"></canvas></button>
      <button class="yn" id="yes" aria-label="Yes, clear"><canvas class="pi" data-ico="check" data-k=".5" data-col="ok"></canvas></button>
    </div>
  </div>
</div>

<div class="overlay" id="parentOverlay">
  <div class="card" id="parentCard">
    <button id="sndBtn">Sound: on</button>
    <button id="fsBtn">Go full screen</button>
    <button id="install">Install app</button>
    <div class="hint">Tip: for a fully locked screen, turn on Android's Screen pinning, then pin this app.</div>
    <button id="closeParent">Back to drawing</button>
  </div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var BG = '#fff';
  var COLORS = ['#E8312F', '#FF922B', '#FFD43B', '#2F9E44', '#1C7ED6', '#7048E8', '#000000'];
  var NAMES = ['Red', 'Orange', 'Yellow', 'Green', 'Blue', 'Purple', 'Black'];
  var NOTES = [262, 294, 330, 392, 440, 523, 196];
  var BASE_W = { pencil: 6, marker: 22, sparkle: 14 };
  var SIZE_MULT = [0.55, 1, 1.9];
  var MAX_LIVE = 40, BAKE_N = 10;

  var cv = $('#cv'), ctx = cv.getContext('2d');
  var base = document.createElement('canvas'), bctx = base.getContext('2d');
  var W = 0, H = 0, dpr = 1;
  var strokes = [];
  var active = {};
  var color = COLORS[0], tool = 'pencil', sizeIdx = 1, erasing = false;
  var muted = false;
  try { muted = localStorage.getItem('la.muted') === '1'; } catch (e) {}

  /* ---------- sound (synthesized, no files) ---------- */
  var AC = null;
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(freq, dur, type, vol, slide) {
    if (muted) return; var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function whoosh() {
    if (muted) return; var a = ac(); if (!a) return;
    var len = a.sampleRate * 0.5, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
    s.buffer = buf; f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(2500, t); f.frequency.exponentialRampToValueAtTime(300, t + 0.5);
    g.gain.value = 0.5; s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
  }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} }

  /* ---------- canvas ---------- */
  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var GLINTS = ['#FFD43B', '#FF8AD8', '#74C0FC', '#8CE99A', '#FFA94D'];

  function drawSeg(c, s, i) {
    var b = s.pts[i], a = s.pts[Math.max(0, i - 1)];
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = s.color; c.lineWidth = s.w;
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
    if (s.tool === 'sparkle') {
      var r = mulberry(s.seed + i);
      for (var k = 0; k < 3; k++) {
        if (r() < 0.3) continue;
        c.fillStyle = GLINTS[Math.floor(r() * GLINTS.length)];
        c.beginPath();
        c.arc(b[0] + (r() - .5) * s.w * 3.2, b[1] + (r() - .5) * s.w * 3.2, 3 + r() * s.w * 0.4, 0, 6.3);
        c.fill();
      }
    }
  }
  function drawStroke(c, s, from) {
    if (s.tool === 'clear') { c.fillStyle = BG; c.fillRect(0, 0, 1e5, 1e5); return; }
    for (var i = from || 0; i < s.pts.length; i++) drawSeg(c, s, i);
  }
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(base, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (var i = 0; i < strokes.length; i++) drawStroke(ctx, strokes[i]);
  }
  function bake() {
    if (strokes.length <= MAX_LIVE) return;
    for (var id in active) return;
    var old = strokes.splice(0, BAKE_N);
    for (var i = 0; i < old.length; i++) drawStroke(bctx, old[i]);
  }
  function fit() {
    var r = cv.getBoundingClientRect();
    var nd = Math.min(window.devicePixelRatio || 1, 2);
    var nw = Math.round(r.width * nd), nh = Math.round(r.height * nd);
    if (!nw || !nh || (nw === cv.width && nh === cv.height)) return;
    /* keep a store that only grows, so a transient shrink (Android nav bar peeking) never crops the drawing */
    var old = null;
    if (base.width) {
      for (var i = 0; i < strokes.length; i++) drawStroke(bctx, strokes[i]);
      old = document.createElement('canvas'); old.width = base.width; old.height = base.height; old.getContext('2d').drawImage(base, 0, 0);
    }
    var bw = Math.max(nw, base.width), bh = Math.max(nh, base.height);
    cv.width = nw; cv.height = nh; base.width = bw; base.height = bh; dpr = nd; W = r.width; H = r.height;
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    bctx.fillStyle = BG; bctx.fillRect(0, 0, bw, bh);
    if (old) bctx.drawImage(old, 0, 0);
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    strokes = [];
    render();
  }

  function pt(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  function isPalm(e) { return e.pointerType === 'touch' && e.width > 90 && e.height > 90; }
  function strokeWidth() {
    var m = SIZE_MULT[sizeIdx];
    return erasing ? 26 * m + 10 : BASE_W[tool] * m;
  }
  cv.addEventListener('pointerdown', function (e) {
    if (isPalm(e) || active[e.pointerId]) return;
    wake();
    var s = { tool: erasing ? 'eraser' : tool, color: erasing ? BG : color, w: strokeWidth(), seed: (Math.random() * 1e9) | 0, pts: [pt(e)] };
    active[e.pointerId] = s; strokes.push(s);
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    drawSeg(ctx, s, 0);
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    var s = active[e.pointerId]; if (!s) return;
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    if (!evs.length) evs = [e];
    for (var k = 0; k < evs.length; k++) { s.pts.push(pt(evs[k])); drawSeg(ctx, s, s.pts.length - 1); }
    e.preventDefault();
  });
  function end(e) { if (active[e.pointerId]) { delete active[e.pointerId]; bake(); } }
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);

  /* ---------- controls ---------- */
  var colorsEl = $('#colors');
  COLORS.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'color' + (i === 0 ? ' sel' : ''); b.style.background = c; b.setAttribute('aria-label', NAMES[i]);
    b.addEventListener('click', function () {
      color = c; erasing = false; syncUI(); buzz(); tone(NOTES[i], 0.18, 'sine', 0.2, 1.5);
    });
    colorsEl.appendChild(b);
  });
  function syncUI() {
    var cs = colorsEl.children;
    for (var i = 0; i < cs.length; i++) cs[i].classList.toggle('sel', !erasing && COLORS[i] === color);
    document.querySelectorAll('[data-tool]').forEach(function (t) { t.classList.toggle('sel', !erasing && t.dataset.tool === tool); });
    document.querySelectorAll('[data-size]').forEach(function (t) { t.classList.toggle('sel', +t.dataset.size === sizeIdx); });
    $('#eraser').classList.toggle('sel', erasing);
  }
  document.querySelectorAll('[data-tool]').forEach(function (b) {
    b.addEventListener('click', function () { tool = b.dataset.tool; erasing = false; syncUI(); buzz(); tone(520, 0.1, 'triangle', 0.15, 1.3); });
  });
  document.querySelectorAll('[data-size]').forEach(function (b) {
    b.addEventListener('click', function () { sizeIdx = +b.dataset.size; syncUI(); buzz(); tone([440, 330, 220][sizeIdx], 0.1, 'triangle', 0.15); });
  });
  $('#eraser').addEventListener('click', function () { erasing = !erasing; syncUI(); buzz(); tone(300, 0.12, 'square', 0.06, 0.7); });
  $('#undo').addEventListener('click', function () {
    if (tOn) { if (tdone) return; tstrokes.pop(); redrawInk(); buzz(); tone(400, 0.14, 'triangle', 0.15, 0.6); return; }
    if (!strokes.length) { tone(150, 0.1, 'sine', 0.1); return; }
    strokes.pop(); render(); buzz(); tone(400, 0.14, 'triangle', 0.15, 0.6);
  });
  var confirmEl = $('#confirm');
  $('#clear').addEventListener('click', function () { if (tOn) { tReset(); whoosh(); return; } confirmEl.classList.add('show'); });
  $('#no').addEventListener('click', function () { confirmEl.classList.remove('show'); });
  $('#yes').addEventListener('click', function () {
    strokes.push({ tool: 'clear', pts: [] }); render(); bake(); confirmEl.classList.remove('show'); whoosh();
  });

  /* ---------- grown-ups corner (hold ~1.2s) ---------- */
  var pbtn = $('#parent'), ptimer = null, pov = $('#parentOverlay'), deferredInstall = null;
  function pdown(e) { e.preventDefault(); pbtn.classList.add('hold'); clearTimeout(ptimer); ptimer = setTimeout(function () { pbtn.classList.remove('hold'); pov.classList.add('show'); }, 1200); }
  function pup() { clearTimeout(ptimer); pbtn.classList.remove('hold'); }
  pbtn.addEventListener('pointerdown', pdown);
  pbtn.addEventListener('pointerup', pup); pbtn.addEventListener('pointerleave', pup); pbtn.addEventListener('pointercancel', pup);
  $('#closeParent').addEventListener('click', function () { pov.classList.remove('show'); });
  function sndLabel() { $('#sndBtn').textContent = 'Sound: ' + (muted ? 'off' : 'on'); }
  sndLabel();
  $('#sndBtn').addEventListener('click', function () {
    muted = !muted; try { localStorage.setItem('la.muted', muted ? '1' : '0'); } catch (e) {} sndLabel(); tone(440, 0.1);
  });
  $('#fsBtn').addEventListener('click', function () {
    var d = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen().catch(function () {});
    pov.classList.remove('show');
  });
  /* Chrome's menu refuses to install when any app on this origin is installed; the page's own prompt still works. Fire on finger lift. */
